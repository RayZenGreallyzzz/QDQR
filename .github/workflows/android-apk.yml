name: Android APK — Phoenix Mesh Workshop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    name: Build Android 15 compatible debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout QDQR
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21 for Capacitor 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK tools
        uses: android-actions/setup-android@v3
      - name: Prepare SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Build offline web interface
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Sync Android assets and plugins
        run: npx cap sync android
      - name: Grant wrapper permission
        run: chmod +x android/gradlew
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PhoenixMeshWorkshop-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixMeshWorkshop-Android-debug
          path: PhoenixMeshWorkshop-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish a downloadable prerelease
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "qdqr-dev-${GITHUB_RUN_NUMBER}" PhoenixMeshWorkshop-debug.apk#PhoenixMeshWorkshop-debug.apk \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "Phoenix Mesh Workshop • Android test ${GITHUB_RUN_NUMBER}" \
            --notes "Debug APK for Android 15. Offline mesh editor prototype; not a production release." \
            --prerelease

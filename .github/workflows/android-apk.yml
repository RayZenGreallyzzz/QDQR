name: Android APK — Phoenix Mesh Workshop
on:
  push:
    branches: [main, fix/android-import-memory-v0.1.13]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qdqr-android-test-${{ github.sha }}
  cancel-in-progress: true

jobs:
  android:
    name: Validate and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout QDQR
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK (without removed tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install SDK 36 and build-tools
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
      - name: Run geometry tests
        run: npm test
      - name: Bundle offline 3D editor
        run: npm run build
      - name: Upload web editor
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixMeshWorkshop-Web-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
      - name: Initialize and sync Android wrapper
        run: |
          npx cap add android
          npx cap sync android
      - name: Install native Android Save As picker
        run: |
          java_dir=android/app/src/main/java/com/phoenix/qdqr/meshworkshop
          mkdir -p "$java_dir"
          cp native/android/NativeFileSavePlugin.java "$java_dir/NativeFileSavePlugin.java"
          cp native/android/MainActivity.java "$java_dir/MainActivity.java"
          grep -q 'registerPlugin(NativeFileSavePlugin.class)' "$java_dir/MainActivity.java"
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: phoenix-qdqr-debug-keystore-v1
      - name: Compile debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Prepare output
        run: |
          mkdir -p outputs
          cp android/app/build/outputs/apk/debug/app-debug.apk outputs/PhoenixMeshWorkshop-debug.apk
          sha256sum outputs/PhoenixMeshWorkshop-debug.apk > outputs/SHA256.txt
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixMeshWorkshop-Android-debug-${{ github.run_number }}
          path: outputs/
          retention-days: 30
          if-no-files-found: error
      - name: Publish test prerelease
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qdqr-dev-${{ github.run_number }}
          name: "Phoenix Mesh Workshop · Android test #${{ github.run_number }}"
          prerelease: true
          generate_release_notes: false
          body: |
            Development/debug APK for Android; not a production release.
            Models are processed locally. Import GLB/OBJ/STL; export GLB preferred for Godot.
            For safety, export work before upgrading.
          files: |
            outputs/PhoenixMeshWorkshop-debug.apk
            outputs/SHA256.txt
